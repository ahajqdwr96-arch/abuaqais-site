<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>الأخبار</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: white;
            color: #111;
            font-family: Arial, sans-serif;
        }

        header {
            background: #000;
            color: white;
            padding: 22px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            color: white;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .news-box {
            background: #000;
            color: white;
            padding: 25px;
            border-radius: 15px;
        }

        .news {
            background: #151515;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 12px;
        }

        .news h2 {
            margin-top: 0;
        }

        .news p {
            color: #aaa;
        }

        .news a {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 18px;
            background: white;
            color: black;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            color: black;
            text-decoration: none;
        }
    </style>
</head>

<body>

<header>
    <h1>أخبار شبكة سوريا نيوز</h1>
</header>

<div class="container">

    <a class="back" href="index.html">
        ← العودة للرئيسية
    </a>

    <div class="news-box">

        <div class="news">

            <h2>عنوان الخبر الأول</h2>

            <p>
                هذا مثال على خبر يمكن نشره في الموقع.
            </p>

            <a href="news/news-1.html">
                قراءة الخبر
            </a>

        </div>

        <div class="news">

            <h2>عنوان الخبر الثاني</h2>

            <p>
                يمكنك إضافة أخبار أخرى هنا.
            </p>

            <a href="news/news-2.html">
                قراءة الخبر
            </a>

        </div>

    </div>

</div>

</body>

</html>
