<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عنوان الخبر</title>

    <style>
        body {
            margin: 0;
            background: #eee;
            font-family: Arial, sans-serif;
        }

        header {
            background: #000;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 850px;
            margin: 35px auto;
            padding: 15px;
        }

        article {
            background: #000;
            color: white;
            padding: 30px;
            border-radius: 16px;
        }

        .tag {
            background: white;
            color: black;
            padding: 7px 12px;
            border-radius: 6px;
            font-weight: bold;
        }

        h1 {
            font-size: 32px;
            line-height: 1.5;
        }

        .date {
            color: #888;
            margin-bottom: 25px;
        }

        .photo {
            width: 100%;
            border-radius: 12px;
        }

        .text {
            color: #ddd;
            font-size: 19px;
            line-height: 2;
        }

        .source {
            border-top: 1px solid #333;
            margin-top: 25px;
            padding-top: 20px;
            color: #aaa;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 20px;
            background: white;
            color: black;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>

<header>
    <strong>شبكة سوريا نيوز</strong>
</header>
