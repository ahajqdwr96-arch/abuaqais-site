<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>عنوان الخبر</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: white;
            color: #111;
            font-family: Arial, sans-serif;
        }

        header {
            background: #000;
            color: white;
            padding: 22px;
            text-align: center;
        }

        .container {
            max-width: 850px;
            margin: 40px auto;
            padding: 20px;
        }

        .article {
            background: #000;
            color: white;
            border-radius: 18px;
            padding: 30px;
        }

        .label {
            display: inline-block;
            background: white;
            color: black;
            padding: 7px 12px;
            border-radius: 7px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 32px;
            line-height: 1.5;
        }

        .date {
            color: #888;
            margin-bottom: 25px;
        }

        .photo {
            width: 100%;
            border-radius: 12px;
            margin: 15px 0 25px;
        }

        .text {
            color: #ddd;
            font-size: 19px;
            line-height: 2;
        }

        .source {
            border-top: 1px solid #333;
            margin-top: 30px;
            padding-top: 20px;
            color: #aaa;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 20px;
            background: white;
            color: black;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <strong>أبو قيس المنغي</strong>
</header>

<div class="container">

    <article class="article">

        <span class="label">عاجل</span>

        <h1>
            عنوان الخبر هنا
        </h1>

        <div class="date">
            20 أيلول 2026
        </div>

        <img
            class="photo"
            src="https://placehold.co/850x450"
            alt="صورة الخبر"
        >

        <div class="text">

            <p>
                اكتب نص الخبر هنا.
            </p>

            <p>
                يمكنك إضافة عدة فقرات للخبر، وتغيير العنوان
                والتاريخ والصورة والمعلومات حسب كل خبر.
            </p>

        </div>

        <div class="source">
            المصدر: اكتب المصدر هنا.
        </div>
